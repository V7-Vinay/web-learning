<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe and Embed Attributes Example</title>
</head>
<body>

    <h2>Iframe and Embed Attributes Example</h2>

    <!-- 1. Iframe with various attributes -->
    <h3>Iframe Example</h3>
    <iframe src="https://www.example.com" 
            width="600" 
            height="400" 
            title="Example Iframe" 
            frameborder="0" 
            allowfullscreen 
            loading="lazy">
    </iframe>
    <!-- 1. iframe: Embeds another HTML page into the current page -->
    <!-- 2. src: Specifies the URL of the document to embed -->
    <!-- 3. width: Specifies the width of the iframe -->
    <!-- 4. height: Specifies the height of the iframe -->
    <!-- 5. title: Provides a title for the iframe (used by screen readers) -->
    <!-- 6. frameborder: Specifies whether to display a border around the iframe (0 for no border, 1 for border) -->
    <!-- 7. allowfullscreen: Allows the iframe to go fullscreen -->
    <!-- 8. loading: Specifies whether to lazy load the iframe (lazy, eager) -->

    <br><br>

    <!-- 2. Embed video example using embed tag -->
    <h3>Embed Example</h3>
    <embed src="https://www.example.com/video.mp4" 
           width="600" 
           height="400" 
           type="video/mp4" 
           autoplay="true">
    </embed>
    <!-- 9. embed: Embeds external content (like videos, audio, or other media) -->
    <!-- 10. src: Specifies the URL of the external resource to embed -->
    <!-- 11. width: Specifies the width of the embedded content -->
    <!-- 12. height: Specifies the height of the embedded content -->
    <!-- 13. type: Specifies the media type of the embedded content -->
    <!-- 14. autoplay: Makes the media play automatically when it is loaded -->

    <br><br>

    <!-- 3. Embed audio example using embed tag -->
    <h3>Embed Audio Example</h3>
    <embed src="https://www.example.com/audio.mp3" 
           width="300" 
           height="50" 
           type="audio/mp3">
    </embed>
    <!-- 15. embed: Embeds external content like audio or video -->
    <!-- 16. src: Specifies the URL of the external audio file -->
    <!-- 17. width: Specifies the width of the embedded audio player -->
    <!-- 18. height: Specifies the height of the embedded audio player -->
    <!-- 19. type: Specifies the media type of the audio file -->

</body>
</html>
