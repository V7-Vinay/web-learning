<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Transform Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f4f4;
    }
    .box {
      border: 1px solid #ddd;
      padding: 10px;
      margin: 10px 0;
      background: #fff;
    }
    .uppercase {
      text-transform: uppercase;
    }
    .lowercase {
      text-transform: lowercase;
    }
    .capitalize {
      text-transform: capitalize;
    }
    .none {
      text-transform: none;
    }
  </style>
</head>
<body>
  <h1>Text Transform Demo</h1>
  <div class="box uppercase">
    This text is transformed to uppercase.
  </div>
  <div class="box lowercase">
    THIS TEXT IS TRANSFORMED TO LOWERCASE.
  </div>
  <div class="box capitalize">
    this text is transformed to capitalize.
  </div>
  <div class="box none">
    This text remains unchanged (none).
  </div>
</body>
</html>
