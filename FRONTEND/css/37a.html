<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Header Example</title>
    <style>
        nav {
            background-color: pink;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }
        header {
            position: sticky;
            top: 0;
        }
        .container {
            background-color: green;
            text-align: center;
            margin: 15px 20px;
            display: flex;
            align-items: center;
            height: 320px;
            padding: 0px 20px;
        }
        .box1, .box2 {
            height: 300px;
            width: 50%;
            display: inline-block;
     
            
        }
        .box1 {
            background-color: chartreuse;
            margin-right: 10px;
        }
        .box2 {
            background-color: chocolate;
        }
        .abc {
            height: 100px;
            background-color: coral;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        p {
            margin: 0;
            border: 3px solid gray;
            padding: 20px;
            border-radius: 13px;
        }
        .orange{
            height: 30px;
            width: 30px;
            background: orange;
            border-radius: 60px;
            position: fixed;
            bottom: 12px;
            right: 23px;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            Sticky Navigation
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>
        <div class="abc">
            <p>
                This is a sample paragraph with some text.
            </p>
        </div>
        <div class="orange"></div>

        <!-- Add more content to see the sticky effect -->
        <div class="container">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>
        <div class="container">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>

    </main>

    <footer>
        <p style="text-align: center;">Footer Content</p>
    </footer>
</body>
</html>
