<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            font-size: 20px;
            color: rgb(240, 248, 7);
            width: 500px;
            height: 300px;
            background-image: url('https://img-s-msn-com.akamaized.net/tenant/amp/entityid/AA1ATvJw.img?w=612&h=344&m=6')
        }
        .repeat{
            width: 100%;
            height: 1000px;
            background-repeat: repeat;
        }
        .rpt-x{
            width: 100%;
            background-repeat: repeat-x;
        }
        .rpt-y{
            background-repeat: repeat-y;
            height: 800px;

        }
    </style>
</head>
<body>
    <div> applying the image using url</div><br>
    <div class="repeat">using the repeat option in both x and y axis</div><br>
    <div class="rpt-x">using the repeat option in x axis only</div><br>
    <div class="rpt-y">using the repeat option in y axis only</div><br>

</body> 
</html>
