<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Size Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .box {
            width: 300px;
            height: 200px;
            border: 2px solid black;
            color: white;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 2px 2px 5px black;
            background-image: url('https://img-s-msn-com.akamaized.net/tenant/amp/entityid/AA1ATvJw.img?w=612&h=344&m=6');
        }

        /* 1. Default (auto) */
        .bg-auto {
            background-size: auto; /* Image stays at its original size */
        }

        /* 2. Cover */
        .bg-cover {
            background-size: cover; /* Covers entire box, may crop */
        }

        /* 3. Contain */
        .bg-contain {
            background-size: contain; /* Fits inside box, may leave space */
        }

        /* 4. 100% 100% */
        .bg-full {
            background-size: 100% 100%; /* Stretches to fit */
        }

        /* 5. Custom Size */
        .bg-custom {
            background-size: 150px 100px; /* Width: 150px, Height: 100px */
        }
    </style>
</head>
<body>

    <h1>Understanding Background Size in CSS</h1>

    <div class="container">
        <div class="box bg-auto">background-size: auto;</div>
        <div class="box bg-cover">background-size: cover;</div>
        <div class="box bg-contain">background-size: contain;</div>
        <div class="box bg-full">background-size: 100% 100%;</div>
        <div class="box bg-custom">background-size: 150px 100px;</div>
    </div>

</body>
</html>
