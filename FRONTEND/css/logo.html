<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Logo</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        .logo {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #f9ce34, #ee2a7b, #6228d7);
            border-radius: 35px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .circle {
            width: 100px;
            height: 100px;
            border: 8px solid white;
            border-radius: 50%;
            position: absolute;
        }

        .dot {
            width: 20px;
            height: 20px;
            background-color: white;
            border-radius: 50%;
            position: absolute;
            top: 30px;
            right: 30px;
        }
    </style>
</head>
<body>
    <div class="logo">
        <div class="circle"></div>
        <div class="dot"></div>
    </div>
</body>
</html>
